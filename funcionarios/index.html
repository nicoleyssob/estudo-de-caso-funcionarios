<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Funcionários</title>
</head>
<body>
    <h1>Gestão de Funcionários</h1>

    <form id="formulario">
        <label for="nome">Nome:</label>
        <input type="text" id="nome" required>
        <br><br>

        <label for="idade">Idade:</label>
        <input type="number" id="idade" min="1" required>
        <br><br>

        <label for="cargo">Cargo:</label>
        <input type="text" id="cargo" required>
        <br><br>

        <label for="salario">Salário:</label>
        <input type="number" id="salario" min="0" step="0.01" required>
        <br><br>

        <button type="submit" id="salvar">Cadastrar</button>
        <button type="button" id="cancelar" hidden>Cancelar edição</button>
    </form>

    <h2>Funcionários cadastrados</h2>
    <table border="1" cellpadding="5">
        <thead>
            <tr>
                <th>Nome</th>
                <th>Idade</th>
                <th>Cargo</th>
                <th>Salário</th>
                <th>Ações</th>
            </tr>
        </thead>
        <tbody id="tabelaFuncionarios"></tbody>
    </table>

    <h2>Relatórios</h2>
    <button type="button" id="salariosAltos">Salários acima de R$ 5.000</button>
    <button type="button" id="mediaSalarial">Média salarial</button>
    <button type="button" id="cargosUnicos">Cargos únicos</button>
    <button type="button" id="nomesMaiusculos">Nomes em maiúsculo</button>
    <div id="relatorio"></div>

    <script src="script.js"></script>
</body>
</html>
